services:

  mysql:
    image: mysql:8.0
    container_name: mysql-db
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: calculator

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: ./backend
    container_name: calculator-backend
    restart: always

    ports:
      - "5000:5000"

    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: root123
      DB_NAME: calculator

    depends_on:
      - mysql

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile

    container_name: calculator-nginx

    restart: always

    ports:
      - "80:80"

    depends_on:
      - backend

volumes:
  mysql-data:
