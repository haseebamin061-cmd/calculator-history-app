name: Build and Push Docker Images

on:
  push:
    branches:
      - main

jobs:

  docker:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3

        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Backend Image
        run: |
          docker build -t haseebamin061/calculator-backend:latest ./backend

      - name: Push Backend Image
        run: |
          docker push haseebamin061/calculator-backend:latest

      - name: Build Nginx Image
        run: |
          docker build -t haseebamin061/calculator-nginx:latest \
          -f nginx/Dockerfile .

      - name: Push Nginx Image
        run: |
          docker push haseebamin061/calculator-nginx:latest
