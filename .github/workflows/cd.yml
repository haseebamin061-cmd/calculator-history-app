name: Deploy to EKS

on:
  workflow_run:
    workflows: ["Build and Push Docker Images"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Get Git SHA
        run: echo "SHA=$(git rev-parse --short ${{ github.event.workflow_run.head_sha }})" >> $GITHUB_ENV

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ap-southeast-1 \
            --name calculator-eks

      - name: Verify EKS connection
        run: |
          kubectl get nodes

      - name: Deploy Calculator with Helm
        working-directory: calculator-chart
        run: |
          helm upgrade --install calculator . \
            --namespace calculator \
            --create-namespace \
            --set frontend.image.repository=375760496125.dkr.ecr.ap-southeast-1.amazonaws.com/calculator-nginx \
            --set frontend.image.tag=${SHA} \
            --set backend.image.repository=375760496125.dkr.ecr.ap-southeast-1.amazonaws.com/calculator-backend \
            --set backend.image.tag=${SHA}

      - name: Wait for Backend Rollout
        run: |
          kubectl rollout status deployment/backend \
            -n calculator \
            --timeout=180s

      - name: Wait for Frontend Rollout
        run: |
          kubectl rollout status deployment/frontend \
            -n calculator \
            --timeout=180s

      - name: Deployment Status
        run: |
          kubectl get pods -n calculator
          kubectl get services -n calculator
          kubectl get ingress -n calculator
