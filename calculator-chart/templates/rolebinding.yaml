apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding

metadata:
  name: app-reader-pod-reader
  namespace: {{ .Release.Namespace }}

subjects:
  - kind: ServiceAccount
    name: app-reader
    namespace: {{ .Release.Namespace }}

roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io
